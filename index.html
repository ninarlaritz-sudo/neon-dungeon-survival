<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Dungeon</title>
<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

canvas {
    display: block;
    margin: 0 auto;
    background: radial-gradient(circle at center, #111, #000);
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 18px;
}

#menu {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    background: #00ffff;
    color: black;
    margin-top: 10px;
}
</style>
</head>
<body>

<div id="menu">
    <h1>NEON DUNGEON</h1>
    <p>Survive the waves</p>
    <button onclick="startGame()">Start</button>
</div>

<div id="ui">Score: 0 | Health: 100</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player, enemies, bullets, score, health, gameRunning;

function reset() {
    player = { x: canvas.width/2, y: canvas.height/2, size: 18, speed: 5 };
    enemies = [];
    bullets = [];
    score = 0;
    health = 100;
    gameRunning = true;
}

function startGame() {
    document.getElementById("menu").style.display = "none";
    reset();
    loop();
}

document.addEventListener("keydown", e => {
    if (!gameRunning) return;

    if (e.key === "w") player.y -= player.speed;
    if (e.key === "s") player.y += player.speed;
    if (e.key === "a") player.x -= player.speed;
    if (e.key === "d") player.x += player.speed;
});

document.addEventListener("click", e => {
    if (!gameRunning) return;

    const angle = Math.atan2(
        e.clientY - player.y,
        e.clientX - player.x
    );

    bullets.push({
        x: player.x,
        y: player.y,
        dx: Math.cos(angle) * 8,
        dy: Math.sin(angle) * 8
    });
});

function spawnEnemy() {
    const edge = Math.floor(Math.random() * 4);
    let x, y;

    if (edge === 0) { x = 0; y = Math.random() * canvas.height; }
    if (edge === 1) { x = canvas.width; y = Math.random() * canvas.height; }
    if (edge === 2) { x = Math.random() * canvas.width; y = 0; }
    if (edge === 3) { x = Math.random() * canvas.width; y = canvas.height; }

    enemies.push({ x, y, size: 18, speed: 1 + Math.random() * 1.5 });
}

setInterval(() => {
    if (gameRunning) spawnEnemy();
}, 900);

function update() {
    if (!gameRunning) return;

    score++;
    document.getElementById("ui").innerText =
        `Score: ${score} | Health: ${health}`;

    bullets.forEach(b => {
        b.x += b.dx;
        b.y += b.dy;
    });

    enemies.forEach(e => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < 18) {
            health -= 1;
        }

        bullets.forEach(b => {
            const d = Math.hypot(b.x - e.x, b.y - e.y);
