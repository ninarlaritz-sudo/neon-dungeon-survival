<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Run: System Breach</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: monospace;
    color: white;
}

canvas {
    display: block;
    margin: 0 auto;
    background: radial-gradient(circle, #0a0a0a, #000);
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 14px;
}

#menu {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    background: #00ffcc;
    border: none;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="menu">
    <h1>CYBER RUN</h1>
    <p>SYSTEM BREACH INITIATED</p>
    <button onclick="startGame()">START</button>
</div>

<div id="ui"></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player, enemies, particles, score, health, speedBoost, damage, gameOver, shake;

function reset() {
    player = { x: canvas.width/2, y: canvas.height/2, size: 16, speed: 4 };
    enemies = [];
    particles = [];
    score = 0;
    health = 100;
    speedBoost = 0;
    damage = 1;
    gameOver = false;
    shake = 0;
}

function startGame() {
    document.getElementById("menu").style.display = "none";
    reset();
    loop();
}

document.addEventListener("keydown", e => {
    if (gameOver) return;

    if (e.key === "w") player.y -= player.speed;
    if (e.key === "s") player.y += player.speed;
    if (e.key === "a") player.x -= player.speed;
    if (e.key === "d") player.x += player.speed;
});

document.addEventListener("click", e => {
    if (gameOver) return;

    enemies.forEach(en => {
        const d = Math.hypot(en.x - e.clientX, en.y - e.clientY);
        if (d < 40) {
            en.hp -= damage;
            shake = 10;

            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: en.x,
                    y: en.y,
                    vx: (Math.random()-0.5)*4,
                    vy: (Math.random()-0.5)*4,
                    life: 20
                });
            }
        }
    });
});

function spawnEnemy() {
    enemies.push({
        x: Math.random()*canvas.width,
        y: -20,
        hp: 3,
        speed: 1 + Math.random()*1.5
    });
}

setInterval(() => {
    if (!gameOver) spawnEnemy();
}, 900);

function update() {
    if (gameOver) return;

    score++;

    if (health <= 0) gameOver = true;

    enemies.forEach(e => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        if (Math.hypot(player.x - e.x, player.y - e.y) < 20) {
            health -= 1;
        }
    });

    enemies = enemies.filter(e => e.hp > 0);

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
    });

    particles = particles.filter(p => p.life > 0);

    if (shake > 0) shake--;
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    if (shake > 0) {
        ctx.translate(Math.random()*6, Math.random()*6);
    }

    // player
    ctx.fillStyle = "#00ffcc";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ffcc";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    // enemies
    enemies.forEach(e => {
        ctx.fillStyle = "#ff0044";
        ctx.fillRect(e.x, e.y, 16, 16);
    });

    // particles
    particles.forEach(p => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(p.x, p.y, 2, 2);
    });

    ctx.restore();

    document.getElementById("ui").innerHTML =
        `Score: ${score}<br>Health: ${health}<br>Enemies: ${enemies.length}`;

    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px monospace";
        ctx.fillText("SYSTEM BREACH FAILED", canvas.width/2 - 200, canvas.height/2);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
</script>

</body>
</html>
